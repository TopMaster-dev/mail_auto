# NGワード定義（クライアント仕様書 §10・§12 準拠）
#
# これは「初期投入用」の定義です。運用中の追加・削除はスプレッドシートの
# 「NGワード」シートで行ってください（毎ポーリングサイクルで再読込されます）。
# このファイルは load_ng_words.py でシートへ反映します。
#
# 判定範囲：
#   受信メール本文 … 全文をこのリストで走査
#   AI生成文       … AIが生成した箇所のみ走査（固定テンプレートは対象外）
#                    固定文に「初期費用」「仲介手数料」が含まれるため、
#                    全文走査では全ての文案が恒久的にNG検出となります。

