# ── 仕様書に記載があるが、意図的に単語リストから外した語 ────────────────
# いずれもクライアント確認のうえ追加可能です。

excluded:
  - words: [外国籍, 高齢者, 生活保護, 無職, フリーター, 水商売, 夜職, 年金]
    reason: >-
      仕様書 §11-3「単純に単語があるだけでNGにせず、排除的・制限的な文脈かを
      判定する」に従い、AIによる差別的表現チェック（文脈判定）で扱います。
      単語リストに入れると「外国籍の方もご相談可能です」も止まってしまいます。

  - words: [初期費用, 仲介手数料, 礼金, 敷金, 保証料, 火災保険料, 鍵交換費用, 日割り]
    reason: >-
      仕様書 §13 が「初期費用の概算希望」を自動送信可の候補として挙げており、
      §10-6 と矛盾するため。これらは通常の問い合わせに頻出する語で、
      含めるとほぼ全ての反響が「要確認」になります。金額トラブル系の語
      （請求ミス・過剰請求・ぼったくり・値下げ・家賃交渉 等）は採用済みです。

  - words: [早く]
    reason: >-
      「早く内見したいです」のような通常の問い合わせに頻出するため。
      緊急性の判定は「至急」「本日中」「すぐ連絡ください」等で担保しています。
