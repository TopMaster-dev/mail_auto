gmail:
  address: "${GMAIL_ADDRESS}"
  app_password: "${GMAIL_APP_PASSWORD}"
  imap_host: imap.gmail.com
  smtp_host: smtp.gmail.com
  smtp_port: 587
  poll_interval_seconds: 300

claude:
  api_key: "${CLAUDE_API_KEY}"
  model: claude-sonnet-4-6
  max_tokens: 600

sheets:
  service_account_json: "${GOOGLE_SERVICE_ACCOUNT_JSON}"
  spreadsheet_id: "${SPREADSHEET_ID}"
  names:
    inquiries: "問い合わせ一覧"
    ng_words: "NGワード"
    templates: "テンプレート"
    send_log: "送信履歴"
    followup_log: "追客履歴"
    review_log: "要確認履歴"
    config: "設定"

wordpress:
  base_url: "${WP_BASE_URL}"
  estate_post_type: estate
  per_page: 100
  app_user: "${WP_APP_USER}"
  app_password: "${WP_APP_PASSWORD}"
  # ACF field names (confirmed by probing /wp-json/wp/v2/estate)
  fields:
    # Vacancy: acf.display_none == "" means the property is listed (vacant)
    vacancy_status: "display_none"
    vacancy_available_value: ""       # empty string = available/listed
    rent: "rent"
    management_fee: "administrative"  # confirmed: not management_fee
    area_sqm: "space"                 # confirmed: acf.space = 専有面積㎡
    walk_minutes: "walktime"          # confirmed: array e.g. ['10','15','20'] — take first
    layout: "list_of_rooms"           # confirmed: array e.g. ['1LDK']
    equipment: "equipment"            # confirmed: array e.g. ['オートロック','モニター']
    commission_free_term: "仲介手数料０円"   # lives in condition2/cat2 taxonomies
  taxonomies:
    train_line: "train"
    area: "area"
    category: ["condition1", "condition2", "room_category", "cat2"]  # condition1 not condition
    building_type: "building"

business_hours:
  start: "10:00"
  end: "18:00"

send:
  all_require_confirmation: true   # global safety switch; never set false before full testing

# ── Phase 2 ──────────────────────────────────────────────────────────────────
followup:
  enabled: true
  scan_interval_minutes: 30        # how often the scheduler scans for due follow-ups
  # Follow-up state lives in the spreadsheet (追客ステータス/次回追客予定日/追客回数),
  # so the scan is stateless and resumes safely after a restart.
  steps:                           # days after the previous mail before each follow-up
    - days: 2                      # 2nd mail, 2 days after the 1st
    - days: 3                      # 3rd mail, 3 days after the 2nd
  max_followups: 2                 # 2nd and 3rd mail (the 1st mail is the initial reply)

inbox_filter:
  enabled: true
  # When true, only process mail that references a property (rentmagazine.jp URL or
  # 物件/内見/問い合わせ keywords). Stronger noise filter; enable if the inbox receives
  # many notifications. Default false processes all non-denylisted mail.
  require_property_signal: false
  # Sender fragments that are never customer inquiries (notifications, portals).
  ignore_senders:
    - "noreply@"
    - "no-reply@"
    - "no-reply-"
    - "lancers.co.jp"
    - "zehitomo.com"
    - "indeedemail.com"
    - "indeed.com"
    - "accounts.google.com"
    - "mail.anthropic.com"
    - "hekikai-takken.gr.jp"

admin:
  host: "0.0.0.0"
  port: 5000
  session_lifetime_minutes: 120
  behind_proxy: false               # set true when served behind nginx/TLS
  password_hash: "${ADMIN_PASSWORD_HASH}"
  secret_key: "${FLASK_SECRET_KEY}"
  allowed_ips: "${ADMIN_ALLOWED_IPS}"   # comma-separated CIDRs; empty = allow all

