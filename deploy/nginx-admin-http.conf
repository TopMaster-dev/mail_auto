# INTERIM nginx site: admin panel on the bare IP over plain HTTP.
#
# Use this only until a domain is available. It has no TLS, so the admin
# password and session cookie cross the network in cleartext. Replace it with
# nginx-admin.conf (TLS via certbot) as soon as a hostname exists.
#
# Install:
#   sudo cp deploy/nginx-admin-http.conf /etc/nginx/sites-available/mail-admin
#   sudo ln -sf /etc/nginx/sites-available/mail-admin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires in config/settings.yaml:
#   admin.behind_proxy:   true    # so X-Forwarded-For reaches the app
#   admin.secure_cookies: false   # no TLS yet; otherwise login silently loops

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The panel posts full mail drafts; the default 1m is tight for long bodies.
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Appends nginx's view of the peer, so the rightmost entry is the true
        # client address. ProxyFix(x_for=1) reads that one — a client-supplied
        # X-Forwarded-For cannot spoof past it.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
