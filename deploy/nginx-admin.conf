# nginx reverse proxy for the admin panel (TLS terminates here).
# Place at /etc/nginx/sites-available/mail-admin and symlink into sites-enabled.
# Obtain a certificate with: certbot --nginx -d admin.example.com
#
# When using this proxy, set admin.behind_proxy: true in config/settings.yaml
# so the IP allowlist sees the real client address (X-Forwarded-For).

server {
    listen 80;
    server_name admin.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
